<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audiobooks — Read Along</title>
    <!-- Anonymous, cookieless, aggregate visit counts via GoatCounter; no personal data.
         Every route reports the one path "/", so a listener counts once per visit.
         If this site ever sends a Content-Security-Policy, allow script-src
         https://gc.zgo.at and connect-src and img-src
         https://jonyen-audiobooks.goatcounter.com. -->
    <script data-goatcounter="https://jonyen-audiobooks.goatcounter.com/count"
            data-goatcounter-settings='{"path": "/"}'
            async src="https://gc.zgo.at/count.v5.js"
            crossorigin="anonymous"
            integrity="sha384-atnOLvQb9t+jTSipvd75X2yginT4PjVbqDdlJAmxMm+wYElFmeR6EmLP5bYeoRVQ"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
